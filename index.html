<body><main class="app"><div class="game" id="scene"></div><div class="shade"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const sceneRoot=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.8)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; sceneRoot.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#b9ced0'); scene.fog=new THREE.Fog('#b9ced0',25,78);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,150); camera.position.set(0,3.8,8.5); camera.lookAt(0,1,-8);
scene.add(new THREE.HemisphereLight('#eaf3e4','#726b52',2)); const sun=new THREE.DirectionalLight('#fff0cb',3.2); sun.position.set(-7,12,5); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-18;scene.add(sun);
let step=0, biomeIndex=0, bootIndex=0, inventory={wood:2,berry:1,stone:0,herb:0,leather:0},crafted={};let totalFound=3;
const biomes=[{name:'Сосновый край',sub:'Тёплый ветер и знакомая тропа',ground:'#78876a',path:'#bca47d',sky:'#b9ced0',trees:'#385940',accent:'#738e58'},{name:'Золотые луга',sub:'Высокая трава качается на ветру',ground:'#9b9b63',path:'#c3ae7c',sky:'#d5d6c6',trees:'#687543',accent:'#a6a257'},{name:'Каменный перевал',sub:'Тропа становится круче и холоднее',ground:'#7d8580',path:'#aaa697',sky:'#b9c9d0',trees:'#53665c',accent:'#829b99'},{name:'Тихая долина',sub:'Впереди — новый дом',ground:'#75876a',path:'#c7b18b',sky:'#c2d5ce',trees:'#42674d',accent:'#819d61'}];
const groundMat=new THREE.MeshStandardMaterial({color:biomes[0].ground,roughness:1}), pathMat=new THREE.MeshStandardMaterial({color:biomes[0].path,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,130,1,1),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.12,-36);ground.receiveShadow=true;scene.add(ground);
const pathGroup=new THREE.Group();scene.add(pathGroup);const pathMeshes=[];
function curveX(z){return Math.sin((z+step*.055)*.12)*2.1+Math.sin(z*.04)*.55}
function makePath(){for(let i=0;i<32;i++){const z=9-i*3.1;const x=curveX(z);const geo=new THREE.PlaneGeometry(3.2,3.25,1,1);const mesh=new THREE.Mesh(geo,pathMat);mesh.rotation.x=-Math.PI/2;mesh.position.set(x,-.035,z-1.5);mesh.receiveShadow=true;pathGroup.add(mesh);pathMeshes.push(mesh)} }
makePath();
function mat(color,roughness=.9){return new THREE.MeshStandardMaterial({color,roughness})}
const trunkMat=mat('#69533e'), leafMats=['#33523d','#496845','#5c774d'].map(c=>mat(c));
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.21,1.35,5),trunkMat);trunk.position.y=.67;trunk.castShadow=true;g.add(trunk);for(let j=0;j<3;j++){let cone=new THREE.Mesh(new THREE.ConeGeometry(1.05-j*.17,1.8,6),leafMats[(Math.random()*3)|0]);cone.position.y=1.35+j*.62;cone.castShadow=true;g.add(cone)}scene.add(g);return g}
function rock(x,z,s=1,color='#85877c'){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),mat(color));m.position.set(x,s*.48,z);m.rotation.set(Math.random(),Math.random(),Math.random());m.scale.y=.7;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
let scenery=[];for(let i=0;i<45;i++){let z=8-i*2.35;let spread=5+Math.random()*7;let x=(Math.random()<.5?-1:1)*spread+curveX(z);scenery.push(Math.random()<.72?tree(x,z,.65+Math.random()*.8):rock(x,z,.35+Math.random()*.8))}
// Soft distant ridges
for(let i=0;i<3;i++){let ridge=new THREE.Mesh(new THREE.ConeGeometry(13+i*3,9+i*2,7),mat(i===0?'#9eaaa0':'#a9b5ad'));ridge.position.set((i-1)*15,1,-47-i*8);ridge.rotation.y=.3;scene.add(ridge)}
// Simple traveler, seen from behind
const avatar=new THREE.Group();scene.add(avatar);avatar.position.set(0,0,1.55);const coat=mat('#8c684b'), pants=mat('#454c43'), skin=mat('#c99d78');
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.29,.55,4,8),coat);body.position.y=1.15;body.castShadow=true;avatar.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),skin);head.position.set(0,1.72,0);head.castShadow=true;avatar.add(head);const hat=new THREE.Mesh(new THREE.CylinderGeometry(.25,.28,.1,10),mat('#4b4937'));hat.position.set(0,1.91,0);avatar.add(hat);
for(let x of [-.14,.14]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.105,.12,.58,7),pants);leg.position.set(x,.45,0);leg.castShadow=true;avatar.add(leg)}
const pack=new THREE.Mesh(new THREE.BoxGeometry(.48,.52,.25),mat('#9a7747'));pack.position.set(0,1.19,.28);pack.castShadow=true;avatar.add(pack);
// Pickups arranged along the trail with visible glints
const pickups=[];const pickupTypes=[['wood','🪵','Сухие ветки'],['berry','🫐','Лесные ягоды'],['stone','🪨','Речной камень'],['herb','🌿','Лекарственная трава'],['leather','🧵','Кусок кожи']];
function addPickup(z,type){const side=(Math.random()<.5?-1:1),x=curveX(z)+side*(2.25+Math.random()*1.05);const geo=type==='stone'?new THREE.DodecahedronGeometry(.28):new THREE.IcosahedronGeometry(.24,0);const mesh=new THREE.Mesh(geo,mat(type==='wood'?'#967147':type==='berry'?'#73804b':type==='stone'?'#888b84':type==='herb'?'#789354':'#9e7756'));mesh.position.set(x,.35,z);mesh.castShadow=true;scene.add(mesh);const halo=new THREE.Mesh(new THREE.TorusGeometry(.35,.025,5,20),new THREE.MeshBasicMaterial({color:'#f5d992',transparent:true,opacity:.8}));halo.rotation.x=Math.PI/2;halo.position.set(x,.12,z);scene.add(halo);pickups.push({mesh,halo,z,type,name:pickupTypes.find(x=>x[0]===type)[2],got:false})}
for(let i=0;i<12;i++){const t=pickupTypes[(Math.random()*pickupTypes.length)|0];addPickup(-i*8-5,t[0])}
const bootTypes=[{icon:'🥾',name:'Кожаные',state:'Надёжные · 82%',speed:1},{icon:'👢',name:'Высокие',state:'Для грязи · 64%',speed:.8},{icon:'🥿',name:'Лёгкие',state:'Для долгого пути · 91%',speed:1.25}];
const inventoryLabels={wood:['🪵','Ветки'],berry:['🫐','Ягоды'],stone:['🪨','Камни'],herb:['🌿','Трава'],leather:['🧵','Кожа']};
function renderInventory(){const el=document.querySelector('#items');el.innerHTML='';const keys=Object.keys(inventory).filter(k=>inventory[k]>0);keys.slice(0,4).forEach(k=>{const s=document.createElement('div');s.className='item-slot';s.title=inventoryLabels[k][1];s.innerHTML=inventoryLabels[k][0]+'<em>'+inventory[k]+'</em>';el.appendChild(s)});while(el.children.length<4){const s=document.createElement('div');s.className='item-slot';s.style.opacity='.45';s.innerHTML='·';el.appendChild(s)}document.querySelector('#capacity').textContent=Object.values(inventory).reduce((a,b)=>a+b,0)+' / 12'}
renderInventory();function updateBoot(){let b=bootTypes[bootIndex];document.querySelector('#boot-icon').textContent=b.icon;document.querySelector('#boot-name').textContent=b.name;document.querySelector('#boot-state').textContent=b.state}
function setBiome(i){biomeIndex=i;let b=biomes[i];document.querySelector('#biome-title').textContent=b.name;document.querySelector('#biome-sub').textContent=b.sub;groundMat.color.set(b.ground);pathMat.color.set(b.path);scene.background.set(b.sky);scene.fog.color.set(b.sky);leafMats.forEach(m=>m.color.set(b.trees));document.querySelector('#progress-fill').style.width=(18+i*24)+'%';toast('Новый биом: '+b.name)}
let toastTimer;function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function walk(){step++;const dist=Math.max(0,1240-step*13);document.querySelector('#distance').textContent=dist.toLocaleString('ru-RU')+' м';avatar.position.x=curveX(-step*.6)*.16;avatar.rotation.y=Math.sin(step*.12)*.06;camera.position.x=curveX(-step*.5)*.12;camera.lookAt(0,.8,-8);for(const mesh of pathMeshes){mesh.position.z+=3.1;if(mesh.position.z>10){mesh.position.z-=99.2;mesh.position.x=curveX(mesh.position.z+1.5)}}for(const p of pickups){if(p.got)continue;p.mesh.position.z+=3.1;p.halo.position.z+=3.1;if(p.mesh.position.z>-.2&&p.mesh.position.z<2.8){p.got=true;scene.remove(p.mesh);scene.remove(p.halo);inventory[p.type]++;totalFound++;renderInventory();document.querySelector('#coin-count').textContent=24+Math.floor(totalFound/3)*2;toast('Найдено: '+p.name+'  +1')}}for(const o of scenery){o.position.z+=3.1;if(o.position.z>12)o.position.z-=100}if(step%4===0){const t=pickupTypes[(step/4-1)%pickupTypes.length];addPickup(-72,t[0])}if(step===20||step===40||step===60)setBiome(Math.min(3,Math.floor(step/20)));if(dist===0){toast('Привал! Путь продолжается…');step=0}}
document.querySelector('#walk-btn').addEventListener('click',walk);document.querySelector('#swap-btn').addEventListener('click',()=>{bootIndex=(bootIndex+1)%bootTypes.length;updateBoot();toast('Обувь сменена: '+bootTypes[bootIndex].name)});
// Hold-to-walk works well on touchscreens; click is also supported.
let walking;const walkBtn=document.querySelector('#walk-btn');walkBtn.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;walking=setInterval(walk,480)});['pointerup','pointerleave','pointercancel'].forEach(ev=>walkBtn.addEventListener(ev,()=>clearInterval(walking)));
const recipes=[{id:'potion',name:'Травяной настой',desc:'Помогает восстановить силы в пути',cost:{herb:2,berry:1},icon:'🧪'},{id:'torch',name:'Походный факел',desc:'Свет в сумерках и тепло у костра',cost:{wood:2,herb:1},icon:'🔥'},{id:'boots',name:'Заплатать обувь',desc:'Кожаные ботинки прослужат дольше',cost:{leather:1,wood:1},icon:'🥾'}];
function showModal(title,copy,content){document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-copy').textContent=copy;document.querySelector('#modal-content').innerHTML=content;document.querySelector('#modal-back').classList.add('open')}
function openCraft(){let html=recipes.map(r=>{let ok=Object.entries(r.cost).every(([k,v])=>inventory[k]>=v)&&!crafted[r.id];let cost=Object.entries(r.cost).map(([k,v])=>`${inventoryLabels[k][0]} ${v}`).join(' · ');return `<div class="recipe"><div><strong>${r.icon} &nbsp;${r.name}</strong><small>${r.desc} · ${cost}</small></div><button class="craft" data-craft="${r.id}" ${ok?'':'disabled'}>${crafted[r.id]?'Готово':'Создать'}</button></div>`}).join('');showModal('Мастерская','Собери материалы в пути и сделай полезные вещи.',html);document.querySelectorAll('[data-craft]').forEach(btn=>btn.onclick=()=>{let r=recipes.find(x=>x.id===btn.dataset.craft);if(Object.entries(r.cost).every(([k,v])=>inventory[k]>=v)){Object.entries(r.cost).forEach(([k,v])=>inventory[k]-=v);crafted[r.id]=true;renderInventory();openCraft();toast('Создано: '+r.name)}})}
document.querySelector('#craft-open').onclick=openCraft;document.querySelector('#modal-close').onclick=()=>document.querySelector('#modal-back').classList.remove('open');document.querySelector('#modal-back').onclick=e=>{if(e.target.id==='modal-back')e.currentTarget.classList.remove('open')};
document.querySelector('#map-btn').onclick=()=>showModal('Карта пути','Ты идёшь по старой торговой дороге через четыре края.','<div style="padding:16px;border-radius:12px;background:#e9e6d9;line-height:2;font-size:13px">● Сосновый край <span style="color:#9ba08e">━━━━━━</span><br>○ Золотые луга <span style="color:#c6c1ad">━━━━━━</span><br>○ Каменный перевал<br>○ Тихая долина</div>');document.querySelector('#journal-btn').onclick=()=>showModal('Полевой дневник','Записки с дороги.','<div style="padding:16px;background:#e9e6d9;border-radius:12px;font-family:Georgia;font-style:italic;line-height:1.6">«Тропа петляет среди сосен. Хорошая обувь — половина пути. Не забыть собирать всё, что может пригодиться у костра.»</div>');let muted=false;document.querySelector('#sound-btn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'♪':'♫';toast(muted?'Звук выключен':'Звук включён')};
function animate(t){requestAnimationFrame(animate);const time=t*.001;for(const p of pickups){if(!p.got){p.mesh.rotation.y+=.008;p.mesh.position.y=.35+Math.sin(time*2+p.z)*.07;p.halo.rotation.z+=.008}}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
